<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工单处理 · 金融小二</title>
<link rel="stylesheet" href="/static/assets/app.css" />
</head>
<body data-role="admin" data-page="tickets"
      data-title="工单处理" data-subtitle="受理与驳回客户工单">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <section class="page">
      <div class="page-head">
        <div>
          <h1>工单处理</h1>
          <div class="sub">受理与驳回客户工单，处理结果实时同步客户侧</div>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-sm" id="refresh">刷新</button>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="tabs" id="tabs"></div>
          <span class="spacer"></span>
          <div class="field" style="min-width:220px">
            <input type="text" id="keyword" placeholder="客户号 / 工单号 / 标题" autocomplete="off" />
          </div>
          <button class="btn btn-primary btn-sm" id="search">查询</button>
        </div>
        <div id="table"><div class="loading">加载中</div></div>
        <div class="pager" id="pager"></div>
      </div>
    </section>
  </div>
</div>

<script src="/static/assets/api.js"></script>
<script src="/static/assets/nav.js"></script>
<script>
(async function () {
  await FA.ensureIdentity();
  const tabsEl = document.getElementById("tabs");
  const keywordEl = document.getElementById("keyword");
  const tableEl = document.getElementById("table");
  const pagerEl = document.getElementById("pager");
  const TABS = [
    { key: "", label: "全部" },
    { key: "submitted", label: "待处理" },
    { key: "processing", label: "处理中" },
    { key: "closed", label: "已办结" },
    { key: "approved", label: "已处理" },
  ];
  let status = "";
  let pageNo = 1;
  const pageSize = 20;
  let counts = {};

  function renderTabs() {
    tabsEl.innerHTML = TABS.map((tab) => {
      const count = tab.key ? (counts[tab.key] || 0) : Object.values(counts).reduce((a, b) => a + b, 0);
      return `<button class="tab${tab.key === status ? " active" : ""}" data-status="${tab.key}">
        ${tab.label}<span class="count">${count}</span>
      </button>`;
    }).join("");
    tabsEl.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        status = btn.dataset.status;
        pageNo = 1;
        renderTabs();
        load();
      });
    });
  }

  async function load() {
    tableEl.innerHTML = '<div class="loading">加载中</div>';
    try {
      const data = await FA.get("/api/portal/admin/tickets", {
        status,
        keyword: keywordEl.value.trim(),
        page_no: pageNo,
        page_size: pageSize,
      });
      counts = data.status_counts || {};
      renderTabs();
      renderTable(data.items || []);
      FA.renderPager(pagerEl, {
        pageNo,
        pageSize,
        total: data.total || 0,
        onChange: (next) => {
          pageNo = next;
          load();
        },
      });
    } catch (err) {
      FA.showError(tableEl, err);
    }
  }

  function renderTable(items) {
    if (!items.length) {
      tableEl.innerHTML = '<div class="empty"><strong>暂无符合条件的工单</strong>请调整筛选条件后重试</div>';
      return;
    }
    tableEl.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>工单号</th><th>客户</th><th>类型</th><th>标题</th><th>状态</th>
        <th>处理人</th><th>提交时间</th><th>操作</th>
      </tr></thead>
      <tbody>${items.map((item) => `<tr>
        <td class="mono">${FA.escapeHtml(item.ticket_no)}</td>
        <td class="strong">${FA.escapeHtml(item.customer_name)}
          <div class="field-hint mono">${FA.escapeHtml(item.customer_no)}</div></td>
        <td>${FA.escapeHtml(FA.labels.ticketType[item.ticket_type] || item.ticket_type)}</td>
        <td>${FA.escapeHtml(item.ticket_title)}
          <div class="field-hint">${FA.escapeHtml((item.ticket_content || "").slice(0, 42))}${(item.ticket_content || "").length > 42 ? "…" : ""}</div></td>
        <td>${FA.badge(item.ticket_status, FA.labels.ticketStatus)}</td>
        <td>${FA.escapeHtml(item.assignee_name || "-")}</td>
        <td>${FA.fmtDateTime(item.submitted_at)}</td>
        <td>${["submitted", "processing"].includes(item.ticket_status)
          ? `<div class="btn-row">
               <button class="btn btn-sm btn-primary" data-approve="${FA.escapeHtml(item.ticket_no)}">受理</button>
               <button class="btn btn-sm btn-danger" data-reject="${FA.escapeHtml(item.ticket_no)}">驳回</button>
             </div>`
          : '<span class="field-hint">已办结</span>'}</td>
      </tr>`).join("")}</tbody></table></div>`;

    tableEl.querySelectorAll("[data-approve]").forEach((btn) => {
      btn.addEventListener("click", () => {
        decide(items.find((i) => i.ticket_no === btn.dataset.approve), "approved");
      });
    });
    tableEl.querySelectorAll("[data-reject]").forEach((btn) => {
      btn.addEventListener("click", () => {
        decide(items.find((i) => i.ticket_no === btn.dataset.reject), "rejected");
      });
    });
  }

  async function decide(item, decision) {
    const values = await FA.formDialog({
      title: decision === "approved" ? "受理工单" : "驳回工单",
      message: `工单 <b>${FA.escapeHtml(item.ticket_no)}</b><br>${FA.escapeHtml(item.ticket_title)}`,
      okText: decision === "approved" ? "确认受理" : "确认驳回",
      fields: [
        {
          name: "task_comment",
          label: "处理意见",
          type: "textarea",
          value: decision === "approved" ? "已联系客户，问题已受理。" : "信息不足，请补充后重新提交。",
        },
      ],
    });
    if (!values) return;
    try {
      await FA.post(
        `/api/portal/admin/tickets/${encodeURIComponent(item.ticket_no)}/decision`,
        { decision, task_comment: values.task_comment }
      );
      FA.toast("工单处理结果已提交。", "success");
      await load();
    } catch (err) {
      FA.toast(err.message, "error");
    }
  }

  document.getElementById("search").addEventListener("click", () => {
    pageNo = 1;
    load();
  });
  keywordEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      pageNo = 1;
      load();
    }
  });
  document.getElementById("refresh").addEventListener("click", load);

  load();
})();
</script>
</body>
</html>
