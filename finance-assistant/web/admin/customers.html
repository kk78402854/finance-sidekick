<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客户管理 · 金融小二</title>
<link rel="stylesheet" href="/static/assets/app.css" />
</head>
<body data-role="admin" data-page="customers"
      data-title="客户管理" data-subtitle="检索客户并查看全量业务视图">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <section class="page">
      <div class="page-head">
        <div>
          <h1>客户管理</h1>
          <div class="sub">支持按客户号、姓名模糊检索</div>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="field" style="min-width:260px">
            <label>关键词</label>
            <input type="text" id="keyword" placeholder="客户号 / 客户姓名" autocomplete="off" />
          </div>
          <button class="btn btn-primary" id="search">查询</button>
          <button class="btn" id="reset">重置</button>
        </div>
        <div id="table"><div class="loading">加载中</div></div>
        <div class="pager" id="pager"></div>
      </div>
    </section>
  </div>
</div>

<script src="/static/assets/api.js"></script>
<script src="/static/assets/nav.js"></script>
<script>
(async function () {
  await FA.ensureIdentity();
  const keywordEl = document.getElementById("keyword");
  const tableEl = document.getElementById("table");
  const pagerEl = document.getElementById("pager");
  let pageNo = 1;
  const pageSize = 20;

  async function load() {
    tableEl.innerHTML = '<div class="loading">加载中</div>';
    try {
      const data = await FA.get("/api/portal/admin/customers", {
        keyword: keywordEl.value.trim(),
        page_no: pageNo,
        page_size: pageSize,
      });
      renderTable(data.items || []);
      FA.renderPager(pagerEl, {
        pageNo,
        pageSize,
        total: data.total || 0,
        onChange: (next) => {
          pageNo = next;
          load();
        },
      });
    } catch (err) {
      FA.showError(tableEl, err);
    }
  }

  function renderTable(items) {
    if (!items.length) {
      tableEl.innerHTML = '<div class="empty"><strong>没有匹配的客户</strong>请更换关键词后重试</div>';
      return;
    }
    tableEl.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>客户号</th><th>客户姓名</th><th>类型</th><th>状态</th>
        <th>风险等级</th><th>所属机构</th><th>开户时间</th><th></th>
      </tr></thead>
      <tbody>${items.map((item) => `<tr>
        <td class="mono">${FA.escapeHtml(item.customer_no)}</td>
        <td class="strong">${FA.escapeHtml(item.customer_name)}</td>
        <td>${item.customer_type === "personal" ? "个人" : FA.escapeHtml(item.customer_type || "-")}</td>
        <td>${FA.badge(item.customer_status, FA.labels.customerStatus)}</td>
        <td><span class="badge badge-gray badge-plain">${FA.escapeHtml(item.risk_level_name || "-")}</span></td>
        <td>${FA.escapeHtml(item.branch_name || "-")}</td>
        <td>${FA.fmtDate(item.opened_at)}</td>
        <td><a class="btn btn-sm btn-ghost"
               href="/admin/customer-detail?customer_no=${encodeURIComponent(item.customer_no)}">详情</a></td>
      </tr>`).join("")}</tbody></table></div>`;
  }

  document.getElementById("search").addEventListener("click", () => {
    pageNo = 1;
    load();
  });
  document.getElementById("reset").addEventListener("click", () => {
    keywordEl.value = "";
    pageNo = 1;
    load();
  });
  keywordEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      pageNo = 1;
      load();
    }
  });

  load();
})();
</script>
</body>
</html>
