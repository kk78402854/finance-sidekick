<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>贷款审批 · 金融小二</title>
<link rel="stylesheet" href="/static/assets/app.css" />
</head>
<body data-role="admin" data-page="loan-approvals"
      data-title="贷款审批" data-subtitle="处理待审批申请，审批通过自动完成签约与放款">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <section class="page">
      <div class="page-head">
        <div>
          <h1>贷款审批</h1>
          <div class="sub">审批通过将自动完成签约与放款，操作全程留痕</div>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-sm" id="refresh">刷新</button>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="tabs" id="tabs"></div>
          <span class="spacer"></span>
          <div class="field" style="min-width:220px">
            <input type="text" id="keyword" placeholder="客户号 / 姓名 / 申请编号" autocomplete="off" />
          </div>
          <button class="btn btn-primary btn-sm" id="search">查询</button>
        </div>
        <div id="table"><div class="loading">加载中</div></div>
        <div class="pager" id="pager"></div>
      </div>
    </section>
  </div>
</div>

<script src="/static/assets/api.js"></script>
<script src="/static/assets/nav.js"></script>
<script>
(async function () {
  await FA.ensureIdentity();
  const tabsEl = document.getElementById("tabs");
  const keywordEl = document.getElementById("keyword");
  const tableEl = document.getElementById("table");
  const pagerEl = document.getElementById("pager");
  const TABS = [
    { key: "", label: "全部" },
    { key: "submitted", label: "待审批" },
    { key: "processing", label: "审批中" },
    { key: "approved", label: "已通过" },
    { key: "rejected", label: "已拒绝" },
  ];
  let status = "";
  let pageNo = 1;
  const pageSize = 20;
  let counts = {};

  function renderTabs() {
    tabsEl.innerHTML = TABS.map((tab) => {
      const count = tab.key ? (counts[tab.key] || 0) : Object.values(counts).reduce((a, b) => a + b, 0);
      return `<button class="tab${tab.key === status ? " active" : ""}" data-status="${tab.key}">
        ${tab.label}<span class="count">${count}</span>
      </button>`;
    }).join("");
    tabsEl.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        status = btn.dataset.status;
        pageNo = 1;
        renderTabs();
        load();
      });
    });
  }

  async function load() {
    tableEl.innerHTML = '<div class="loading">加载中</div>';
    try {
      const data = await FA.get("/api/portal/admin/loan-applications", {
        status,
        keyword: keywordEl.value.trim(),
        page_no: pageNo,
        page_size: pageSize,
      });
      counts = data.status_counts || {};
      renderTabs();
      renderTable(data.items || []);
      FA.renderPager(pagerEl, {
        pageNo,
        pageSize,
        total: data.total || 0,
        onChange: (next) => {
          pageNo = next;
          load();
        },
      });
    } catch (err) {
      FA.showError(tableEl, err);
    }
  }

  function canDecide(item) {
    return item.application_status === "submitted" || item.application_status === "processing";
  }

  function renderTable(items) {
    if (!items.length) {
      tableEl.innerHTML = '<div class="empty"><strong>暂无符合条件的申请</strong>请调整筛选条件后重试</div>';
      return;
    }
    tableEl.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>申请编号</th><th>客户</th><th>产品</th><th class="num">申请金额</th>
        <th>期限</th><th>用途</th><th>状态</th><th>提交时间</th><th>操作</th>
      </tr></thead>
      <tbody>${items.map((item) => `<tr>
        <td class="mono">${FA.escapeHtml(item.application_no)}</td>
        <td class="strong">${FA.escapeHtml(item.customer_name)}
          <div class="field-hint mono">${FA.escapeHtml(item.customer_no)}</div></td>
        <td>${FA.escapeHtml(item.product_name)}<div class="field-hint">${FA.escapeHtml(FA.labels.repayment[item.repayment_method] || "")}</div></td>
        <td class="num">¥ ${FA.fmtMoney(item.apply_amount)}</td>
        <td>${item.apply_term_months} 个月</td>
        <td>${FA.escapeHtml(item.loan_purpose || "-")}</td>
        <td>${FA.badge(item.application_status, FA.labels.loanStatus)}</td>
        <td>${FA.fmtDateTime(item.submitted_at)}</td>
        <td>${canDecide(item)
          ? `<div class="btn-row">
               <button class="btn btn-sm btn-primary" data-approve="${FA.escapeHtml(item.application_no)}">通过</button>
               <button class="btn btn-sm btn-danger" data-reject="${FA.escapeHtml(item.application_no)}">拒绝</button>
             </div>`
          : '<span class="field-hint">已处理</span>'}</td>
      </tr>`).join("")}</tbody></table></div>`;

    tableEl.querySelectorAll("[data-approve]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = items.find((i) => i.application_no === btn.dataset.approve);
        approve(item);
      });
    });
    tableEl.querySelectorAll("[data-reject]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = items.find((i) => i.application_no === btn.dataset.reject);
        reject(item);
      });
    });
  }

  async function approve(item) {
    const values = await FA.formDialog({
      title: "审批通过",
      message: `客户 <b>${FA.escapeHtml(item.customer_name)}</b> 申请 <b>${item.product_name}</b>，
        申请金额 ¥${FA.fmtMoney(item.apply_amount)}，期限 ${item.apply_term_months} 个月。`,
      okText: "确认通过",
      fields: [
        { name: "approved_amount", label: "批准金额（元）", type: "number", value: item.apply_amount, required: true },
        { name: "approved_rate", label: "执行年利率（%）", type: "number", value: (Number(item.annual_interest_rate) * 100).toFixed(2), required: true },
        { name: "approved_term_months", label: "批准期限（月）", type: "number", value: item.apply_term_months, required: true },
        { name: "approval_comment", label: "审批意见", type: "textarea", value: "资料齐全，同意放款。" },
      ],
    });
    if (!values) return;
    await decide(item.application_no, {
      decision: "approved",
      approved_amount: values.approved_amount,
      // 表单里填的是百分数，回传中台前换算回小数
      approved_rate: (Number(values.approved_rate) / 100).toFixed(6),
      approved_term_months: values.approved_term_months,
      approval_comment: values.approval_comment,
    });
  }

  async function reject(item) {
    const values = await FA.formDialog({
      title: "审批拒绝",
      message: `确认拒绝 <b>${FA.escapeHtml(item.customer_name)}</b> 的 ${item.product_name} 申请？`,
      okText: "确认拒绝",
      fields: [
        { name: "approval_comment", label: "拒绝原因", type: "textarea", value: "综合评分不足，暂不符合放款条件。" },
      ],
    });
    if (!values) return;
    await decide(item.application_no, {
      decision: "rejected",
      approval_comment: values.approval_comment,
    });
  }

  async function decide(applicationNo, body) {
    try {
      const result = await FA.post(
        `/api/portal/admin/loan-applications/${encodeURIComponent(applicationNo)}/decision`,
        body
      );
      const auto = (result && result.auto_disbursement) || {};
      if (auto.status === "success") {
        FA.toast(`审批通过，已自动签约并放款 ¥${FA.fmtMoney(auto.amount)}。`, "success");
      } else if (auto.status === "failed") {
        FA.toast(`审批已通过，但自动放款失败：${auto.message}`, "error");
      } else {
        FA.toast("审批结果已提交。", "success");
      }
      await load();
    } catch (err) {
      FA.toast(err.message, "error");
    }
  }

  document.getElementById("search").addEventListener("click", () => {
    pageNo = 1;
    load();
  });
  keywordEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      pageNo = 1;
      load();
    }
  });
  document.getElementById("refresh").addEventListener("click", load);

  load();
})();
</script>
</body>
</html>
