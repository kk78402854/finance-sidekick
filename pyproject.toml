[project]
name = "finance-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "pymysql>=1.1.1",
    "pytest>=8.4.1",
    "python-dotenv>=1.0.1",
    "tzdata>=2026.2",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "__pycache__", "docs", "seeds"]

[tool.ruff.lint]
# 只启用有明确收益且不会对 FastAPI 惯用写法产生误报的规则。
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# 数据生成与集成测试里有大量长 SQL / 断言，行宽不是这里的质量重点。
"generate/**" = ["E501"]
"tests/**" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: 需要本地 MySQL 与已生成的业务数据的集成测试",
]
