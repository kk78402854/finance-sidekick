  <g filter="url(#shadow)">
    <rect x="15" y="676" width="136" height="58" rx="10" fill="url(#cardGreen)" stroke="#bbf7d0" stroke-opacity="0.75"/>
    <rect x="25" y="690" width="26" height="26" rx="7" fill="url(#iconGreen)"/>
    <g transform="translate(38,703)">
      <path class="icon" d="M-7,-7 C-4,-9 0,-9 0,-7 L0,7 C0,5 -4,5 -7,7 Z M7,-7 C4,-9 0,-9 0,-7"/>
      <path class="icon" d="M0,-7 L0,7"/>
    </g>
    <text class="t main" x="56" y="695" font-size="12.5">I Knowledge</text>
    <text class="t sub" x="56" y="712" font-size="10">知识检索</text>
    <text class="t sub" x="56" y="726" font-size="10">FAQ / RAG</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="159" y="676" width="136" height="58" rx="10" fill="url(#cardGreen)" stroke="#bbf7d0" stroke-opacity="0.75"/>
    <rect x="169" y="690" width="26" height="26" rx="7" fill="url(#iconGreen)"/>
    <g transform="translate(182,703)">
      <circle class="icon" r="8"/>
      <circle cx="-3" cy="-2.5" r="1.2" fill="#ffffff"/>
      <circle cx="3" cy="-2.5" r="1.2" fill="#ffffff"/>
      <path class="icon" d="M-3.5,3 C-2,5 2,5 3.5,3"/>
    </g>
    <text class="t main" x="202" y="695" font-size="12.5">J ChitChat</text>
    <text class="t sub" x="202" y="712" font-size="10">闲聊寒暄</text>
    <text class="t sub" x="202" y="726" font-size="10">非业务问题</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="303" y="676" width="136" height="58" rx="10" fill="url(#cardGreen)" stroke="#bbf7d0" stroke-opacity="0.75"/>
    <rect x="313" y="690" width="26" height="26" rx="7" fill="url(#iconGreen)"/>
    <g transform="translate(326,703)">
      <rect class="icon" x="-8" y="-5" width="16" height="11" rx="2"/>
      <path class="icon" d="M-4,-5 L-4,-8 L4,-8 L4,-5"/>
    </g>
    <text class="t main" x="346" y="695" font-size="12.5">K Task</text>
    <text class="t sub" x="346" y="712" font-size="10">FlowExecutor</text>
    <text class="t sub" x="346" y="726" font-size="10">流程推进</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="447" y="676" width="136" height="58" rx="10" fill="url(#cardGreen)" stroke="#bbf7d0" stroke-opacity="0.75"/>
    <rect x="457" y="690" width="26" height="26" rx="7" fill="url(#iconGreen)"/>
    <g transform="translate(470,703)">
      <circle class="icon" r="8"/>
      <path class="icon" d="M-2.5,-3 C-2.5,-5 2.5,-5 2.5,-2.5 C2.5,-0.5 0,-1 0,1"/>
      <circle cx="0" cy="4.2" r="1.1" fill="#ffffff"/>
    </g>
    <text class="t main" x="490" y="695" font-size="12.5">L Clarify</text>
    <text class="t sub" x="490" y="712" font-size="10">计划无效</text>
    <text class="t sub" x="490" y="726" font-size="10">引导澄清</text>
  </g>

  <g>
    <rect x="52" y="652" width="62" height="18" rx="9" fill="#fbbf24" stroke="#ffe6ae" stroke-width="1"/>
    <text class="pill" x="83" y="665" text-anchor="middle">知识问答</text>
    <rect x="196" y="652" width="62" height="18" rx="9" fill="#fbbf24" stroke="#ffe6ae" stroke-width="1"/>
    <text class="pill" x="227" y="665" text-anchor="middle">闲聊</text>
    <rect x="340" y="652" width="62" height="18" rx="9" fill="#fbbf24" stroke="#ffe6ae" stroke-width="1"/>
    <text class="pill" x="371" y="665" text-anchor="middle">业务任务</text>
    <rect x="484" y="652" width="62" height="18" rx="9" fill="#fbbf24" stroke="#ffe6ae" stroke-width="1"/>
    <text class="pill" x="515" y="665" text-anchor="middle">无效</text>
  </g>

  <!-- F / M / 右侧卡片 -->
  <g filter="url(#shadow)">
    <rect x="630" y="418" width="360" height="58" rx="11" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.45"/>
    <rect x="642" y="432" width="30" height="30" rx="8" fill="url(#iconBlue)" stroke="#ffffff" stroke-opacity="0.5"/>
    <g transform="translate(657,447)">
      <path class="icon" d="M0,-8 L8,-4 L8,4 L0,8 L-8,4 L-8,-4 Z"/>
      <path class="icon" d="M-8,-4 L0,0 L8,-4 M0,0 L0,8"/>
    </g>
    <text class="t main" x="685" y="443">F　写入 focused_object</text>
    <text class="t sub" x="685" y="462">对象消息（账户 / 卡 / 交易 / 贷款）转成槽位</text>
  </g>

  <g filter="url(#shadow)">
    <polygon points="810,520 960,580 810,640 660,580" fill="url(#diamond)" stroke="#ffe6ae" stroke-width="1.6"/>
    <text class="dmain" x="810" y="570" text-anchor="middle" font-size="15">M　是否匹配当前 Task</text>
    <text class="dmain" x="810" y="592" text-anchor="middle" font-size="15">正在收集的槽位？</text>
  </g>

  <g>
    <rect x="664" y="588" width="48" height="18" rx="9" fill="#fbbf24" stroke="#ffe6ae" stroke-width="1"/>
    <text class="pill" x="688" y="601" text-anchor="middle">匹配</text>
    <rect x="892" y="588" width="58" height="18" rx="9" fill="#fbbf24" stroke="#ffe6ae" stroke-width="1"/>
    <text class="pill" x="921" y="601" text-anchor="middle">不匹配</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="676" width="160" height="58" rx="10" fill="url(#cardGreen)" stroke="#bbf7d0" stroke-opacity="0.75"/>
    <rect x="630" y="690" width="26" height="26" rx="7" fill="url(#iconGreen)"/>
    <g transform="translate(643,703)">
      <rect class="icon" x="-8" y="-5" width="16" height="11" rx="2"/>
      <path class="icon" d="M-4,-5 L-4,-8 L4,-8 L4,-5"/>
    </g>
    <text class="t main" x="664" y="696" font-size="12.5">N Task</text>
    <text class="t sub" x="664" y="715">SetSlots 补槽位</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="676" width="160" height="58" rx="10" fill="url(#cardGreen)" stroke="#bbf7d0" stroke-opacity="0.75"/>
    <rect x="860" y="690" width="26" height="26" rx="7" fill="url(#iconGreen)"/>
    <g transform="translate(873,703)">
      <circle class="icon" r="8"/>
      <path class="icon" d="M-2.5,-3 C-2.5,-5 2.5,-5 2.5,-2.5 C2.5,-0.5 0,-1 0,1"/>
      <circle cx="0" cy="4.2" r="1.1" fill="#ffffff"/>
    </g>
    <text class="t main" x="894" y="696" font-size="13">O Clarify</text>
    <text class="t sub" x="894" y="715">引导补充信息</text>
  </g>

  <!-- P/Q -->
  <g filter="url(#shadow)">
    <rect x="337" y="795" width="350" height="56" rx="11" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.48"/>
    <rect x="349" y="808" width="30" height="30" rx="8" fill="url(#iconBlue)" stroke="#ffffff" stroke-opacity="0.5"/>
    <g transform="translate(364,823)">
      <rect class="icon" x="-7" y="-8" width="14" height="16" rx="2"/>
      <path class="icon" d="M-4,-4 L4,-4 M-4,0 L4,0"/>
      <path class="icon" d="M-4,4 L0,6 L5,2"/>
    </g>
    <text class="t main" x="390" y="819">P　提交本轮记录</text>
    <text class="t sub" x="390" y="838">把 Turn 追加到当前 Session</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="337" y="872" width="350" height="56" rx="11" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.48"/>
    <rect x="349" y="885" width="30" height="30" rx="8" fill="url(#iconBlue)" stroke="#ffffff" stroke-opacity="0.5"/>
    <g transform="translate(364,900)">
      <path class="icon" d="M-8,-6 L8,-1 L-2,2 L-4,8 Z"/>
      <path class="icon" d="M-2,2 L8,-1"/>
    </g>
    <text class="t main" x="390" y="896">Q　返回 ProcessResult</text>
    <text class="t sub" x="390" y="915">统一响应给前端：sender_id / message_id / messages</text>
  </g>
</svg>
